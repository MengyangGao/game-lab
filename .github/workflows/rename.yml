name: Rename project to Game Lab
on:
  push:
    branches: [main]
permissions:
  administration: write
jobs:
  rename:
    if: github.repository == 'MengyangGao/puzzle-lab'
    runs-on: ubuntu-latest
    steps:
      - name: Rename repository and update description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH /repos/MengyangGao/puzzle-lab -f name=game-lab -f description='Game Lab · 机关玩法合集'
