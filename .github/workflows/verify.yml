name: Verify and deploy Game Lab
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: |
          python -m http.server 8174 --bind 127.0.0.1 --directory public &
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8174/ > /dev/null; then break; fi
            sleep 1
          done
          python tests/browser.py
        env:
          PUZZLE_LAB_SCREENSHOTS: screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots

  deploy:
    needs: [engines, browser]
    if: vars.PUZZLE_LAB_PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
